name: plugin-dist

# HM1 Task 8 (D86, spec A.2): pack the plugin once, install it into disposable OpenClaw instances (min and latest)
# on the five release targets, run the selftest, and drive the installer end to end: fresh install, an upgrade that
# keeps every stored row (D89, HM1-R13), a forced failing verify that rolls back (the driver asserts the store was
# found untouched and not restored, HM1-R-F2), uninstall. Plus a non-blocking WSL leg (C8) and a nightly upgrade
# from the newest GitHub Release (HM1-R13). HM2 Task 11 adds the Hermes legs (hermes on three OSes, hermes-wsl) and
# the node-pins check; see the comments at those jobs.
#
# Every OpenClaw here lives under $RUNNER_TEMP (OPENCLAW_HOME, OPENCLAW_STATE_DIR; HOME too on POSIX) and
# tests/helpers/assert-disposable.mjs runs right after installing it (HM1-R11). No Gateway is installed or started.
# Feeds are TEST ONLY: signed per leg with an ephemeral key (tests/helpers/sign-feed-for-ci.mjs), file:// URLs,
# honoured only with PLUR1BUS_PLUGIN_INSTALLER_TEST=1. No secrets are used.

permissions:
  contents: read

# A release tag runs this through plugin-release.yml (workflow_call); no tag trigger of its own.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/dist/**'
      - 'lib/selftest/**'
      - 'lib/snapshot/**'
      - '.github/workflows/plugin-dist.yml'
      - 'package*.json'
      - 'openclaw.plugin.json'
      - 'tests/helpers/assert-disposable.mjs'
      - 'tests/helpers/seed-store.mjs'
      - 'tests/helpers/store-digest.mjs'
      - 'tests/helpers/sign-feed-for-ci.mjs'
      - 'tests/helpers/ci-plugin-dist.mjs'
      - 'tests/helpers/ci-hermes-dist.mjs'
      - 'tests/helpers/check-node-pins.mjs'
  workflow_call:
    outputs:
      artifact:
        description: Name of the pack artefact (plugin tarball, its -ci.0 twin, installer bundle, TEST ONLY bootstraps, pack.json)
        value: ${{ jobs.pack.outputs.artifact }}

jobs:
  pack:
    name: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.pack.outputs.version }}
      ci-version: ${{ steps.pack.outputs.ci-version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      integrity: ${{ steps.pack.outputs.integrity }}
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Pack the plugin, its -ci.0 twin, the installer bundle and TEST ONLY bootstraps
        id: pack
        env:
          ARTIFACT: plugin-dist-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/plugin-dist"
          mkdir -p "$out"
          field() { node -e 'const [f,k]=process.argv.slice(1); process.stdout.write(String(JSON.parse(require("fs").readFileSync(f,"utf8"))[0][k]))' "$1" "$2"; }

          npm pack --json --pack-destination "$out" > "$RUNNER_TEMP/npm-pack.json"
          version=$(field "$RUNNER_TEMP/npm-pack.json" version)
          tgz=$(field "$RUNNER_TEMP/npm-pack.json" filename)
          integrity=$(field "$RUNNER_TEMP/npm-pack.json" integrity)
          sha256=$(sha256sum "$out/$tgz" | cut -d' ' -f1)

          # HM1-R13: the same commit packed again as <v>-ci.0, the start version of the upgrade leg.
          ci_version="$version-ci.0"
          npm version --no-git-tag-version --allow-same-version "$ci_version" > /dev/null
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("openclaw.plugin.json","utf8")); m.version=process.argv[1]; fs.writeFileSync("openclaw.plugin.json", JSON.stringify(m,null,2)+"\n")' "$ci_version"
          npm pack --json --pack-destination "$out" > "$RUNNER_TEMP/npm-pack-ci.json"
          ci_tgz=$(field "$RUNNER_TEMP/npm-pack-ci.json" filename)
          git checkout -- package.json package-lock.json openclaw.plugin.json

          node scripts/dist/build-installer.mjs --out "$out/plur1bus-plugin-installer.mjs"
          node scripts/dist/render-bootstraps.mjs --test-key --node-pins scripts/dist/node-pins.json --out-dir "$out"
          node -e 'const [f,...v]=process.argv.slice(1); const k=["version","ciVersion","tgz","ciTgz","sha256","integrity"]; require("fs").writeFileSync(f, JSON.stringify(Object.fromEntries(k.map((x,i)=>[x,v[i]])),null,2)+"\n")' \
            "$out/pack.json" "$version" "$ci_version" "$tgz" "$ci_tgz" "$sha256" "$integrity"
          # smoke: both tarballs make a valid, signed feed (each install leg signs its own, with its own paths)
          node tests/helpers/sign-feed-for-ci.mjs --artefacts "$out" --out-dir "$RUNNER_TEMP/feed-smoke"
          ls -l "$out"

          {
            echo "version=$version"
            echo "ci-version=$ci_version"
            echo "sha256=$sha256"
            echo "integrity=$integrity"
            echo "artifact=$ARTIFACT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### pack"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$version\` (\`$tgz\`) |"
            echo "| sha256 | \`$sha256\` |"
            echo "| integrity | \`$integrity\` |"
            echo "| ci twin | \`$ci_version\` (\`$ci_tgz\`) |"
            echo "| artefact | \`$ARTIFACT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the pack artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: ${{ runner.temp }}/plugin-dist
          if-no-files-found: error
          retention-days: 7

  install:
    name: install (${{ matrix.runner }}, OpenClaw ${{ matrix.openclaw }})
    needs: pack
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
        openclaw: [min, latest]
    defaults:
      run:
        shell: bash
    steps:
      # Audit artefacts under docs/ exceed MAX_PATH; must be set before checkout.
      - name: Enable git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: 'npm'
      # The helpers read stores with this repo's @lancedb/lancedb once the plugin is uninstalled; no lifecycle scripts.
      - name: Install dependencies (helpers only)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the pack artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.pack.outputs.artifact }}
          path: ${{ runner.temp }}/plugin-dist
      - name: Disposable OpenClaw locations (HM1-R11)
        run: node tests/helpers/ci-plugin-dist.mjs env
      - name: Resolve the OpenClaw version (HM1-R12)
        id: oc
        env:
          WHICH: ${{ matrix.openclaw }}
        run: |
          set -euo pipefail
          if [ "$WHICH" = min ]; then
            v=$(node -p "require('./package.json').openclaw.compat.minGatewayVersion")
          else
            v=$(npm view openclaw dist-tags.latest)
          fi
          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
          printf '### %s, OpenClaw %s = %s\n\n' "${{ matrix.runner }}" "$WHICH" "$v" >> "$GITHUB_STEP_SUMMARY"
      - name: Install OpenClaw (POSIX, install-cli.sh)
        if: runner.os != 'Windows'
        env:
          OC_VERSION: ${{ steps.oc.outputs.version }}
        run: |
          set -euo pipefail
          # install-cli.sh writes ~/.npm and shell rc files under HOME (fact sheet step 1): HOME is disposable too.
          export HOME="$OPENCLAW_HOME"
          curl -fsSL --proto '=https' --tlsv1.2 https://openclaw.ai/install-cli.sh | bash -s -- --prefix "$RUNNER_TEMP/oc" --version "$OC_VERSION" --json
          echo "$RUNNER_TEMP/oc/bin" >> "$GITHUB_PATH"
      # A global npm install; acceptable only because the runner is disposable (HM1-R11).
      - name: Install OpenClaw (Windows, install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OC_VERSION: ${{ steps.oc.outputs.version }}
        # openclaw.ai serves install.ps1 with a content type pwsh 7 does not treat as text, so .Content is a byte[] and
        # [scriptblock]::Create got "35 32 79 112 ..." ("# OpenClaw Installer", run 36514170524): decode it as UTF-8.
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $r = Invoke-WebRequest -UseBasicParsing https://openclaw.ai/install.ps1
          $isBytes = $r.Content -is [byte[]]
          $text = if ($isBytes) { [Text.Encoding]::UTF8.GetString($r.Content) } else { [string]$r.Content }
          $text = $text.TrimStart([char]0xFEFF)
          Write-Host ('FACT win32.installPs1: ' + (ConvertTo-Json -Compress @{ contentType = "$($r.Headers['Content-Type'])"; contentIsBytes = $isBytes; chars = $text.Length }))
          & ([scriptblock]::Create($text)) -Tag $env:OC_VERSION -NoOnboard
      # install.ps1 may end its script with `exit`, so finding openclaw.cmd is a step of its own.
      - name: Install OpenClaw (Windows, put openclaw.cmd on PATH)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @((npm prefix -g).Trim(), (Join-Path $env:APPDATA 'npm'), (Join-Path $env:LOCALAPPDATA 'OpenClaw\deps\portable-node')) +
            @(([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') | Where-Object { $_ })
          $dir = $candidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'openclaw.cmd') } | Select-Object -First 1
          if (-not $dir) { throw "openclaw.cmd not found in: $($candidates -join '; ')" }
          Write-Host "openclaw.cmd in $dir"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir
      - name: assert-disposable (first step after installing OpenClaw, HM1-R11)
        # POSIX: every OpenClaw call runs with HOME = OPENCLAW_HOME (install-cli.sh step, ci-plugin-dist.mjs)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node tests/helpers/assert-disposable.mjs
          else
            HOME="$OPENCLAW_HOME" node tests/helpers/assert-disposable.mjs --var HOME
          fi
      - name: Restore the E5 model cache (HM1-R21)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/oc-home/models/plur1bus
          key: e5-614241f6-${{ runner.os }}-${{ runner.arch }}
      # FACT lines answer the fact sheet's "verify in Task 8" questions (layout, openclaw.cmd, gateway status fields).
      - name: OpenClaw facts for docs/distribution/openclaw-cli-facts.md
        run: node tests/helpers/ci-plugin-dist.mjs facts
      - name: cmd.exe /v:off argv (Windows)
        if: runner.os == 'Windows'
        run: node tests/helpers/ci-plugin-dist.mjs cmd-argv
      - name: Raw path (npm-pack install, inspect --runtime, selftest --download-models, dot-dir scan, uninstall)
        run: node tests/helpers/ci-plugin-dist.mjs raw --artefacts "$RUNNER_TEMP/plugin-dist"
      - name: Sign a TEST ONLY feed over the pack artefact
        run: node tests/helpers/sign-feed-for-ci.mjs --artefacts "$RUNNER_TEMP/plugin-dist" --out-dir "$OC_FEED_DIR" --github-env "$GITHUB_ENV"
      # install-plugin.sh on POSIX, install-plugin.ps1 under Windows PowerShell 5.1 on Windows (the byte-identical
      # --json check also runs it under pwsh 7).
      - name: Installer path (fresh -ci.0, seed 50 rows, forced failing update with the store untouched, update, byte-identical --json, uninstall)
        run: node tests/helpers/ci-plugin-dist.mjs installer --artefacts "$RUNNER_TEMP/plugin-dist" --feed-dir "$OC_FEED_DIR"
      - name: ClawHub non-TTY install with and without --accept-capabilities (T5-b, informational)
        continue-on-error: true
        run: node tests/helpers/ci-plugin-dist.mjs clawhub --artefacts "$RUNNER_TEMP/plugin-dist"

  # C8: non-blocking for four weeks. windows-11-arm has no WSL leg (F14).
  wsl:
    name: wsl (windows-2025, Ubuntu-24.04, OpenClaw latest)
    needs: pack
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Download the pack artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.pack.outputs.artifact }}
          path: ${{ runner.temp }}/plugin-dist
      - name: Disposable locations
        run: node tests/helpers/ci-plugin-dist.mjs env
      - name: Resolve OpenClaw latest (HM1-R12)
        id: oc
        run: |
          v=$(npm view openclaw dist-tags.latest)
          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
          printf '### WSL Ubuntu-24.04, OpenClaw latest = %s\n\n' "$v" >> "$GITHUB_STEP_SUMMARY"
      # Vampire/setup-wsl v7.0.0 (tag object 5fae231e, commit d1da7f2c), current release on 2026-09-29.
      - name: Set up WSL Ubuntu-24.04
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl ca-certificates git
      - name: Install OpenClaw latest inside WSL (install-cli.sh, prefix and state under /tmp/plur1bus-ci)
        env:
          OC_VERSION: ${{ steps.oc.outputs.version }}
        run: node tests/helpers/ci-plugin-dist.mjs wsl-setup --distro Ubuntu-24.04 --openclaw-version "$OC_VERSION"
      - name: Sign a TEST ONLY feed over the pack artefact
        run: node tests/helpers/sign-feed-for-ci.mjs --artefacts "$RUNNER_TEMP/plugin-dist" --out-dir "$OC_FEED_DIR"
      - name: install-plugin.ps1 -Target wsl:Ubuntu-24.04 --offline <tgz> --non-interactive --json
        run: node tests/helpers/ci-plugin-dist.mjs wsl-install --distro Ubuntu-24.04 --artefacts "$RUNNER_TEMP/plugin-dist" --feed-dir "$OC_FEED_DIR"
      - name: Selftest inside WSL
        run: node tests/helpers/ci-plugin-dist.mjs wsl-selftest --distro Ubuntu-24.04

  # HM1-R13: nightly upgrade from the newest GitHub Release .tgz; non-blocking until 7.17.0 is released.
  upgrade-from-release:
    name: upgrade-from-release (nightly)
    needs: pack
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - name: Install dependencies (helpers only)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the pack artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.pack.outputs.artifact }}
          path: ${{ runner.temp }}/plugin-dist
      - name: Disposable OpenClaw locations (HM1-R11)
        run: node tests/helpers/ci-plugin-dist.mjs env
      - name: Download the newest GitHub Release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'cyb3rb1ade-plur1bus-memory-*.tgz' --dir "$RUNNER_TEMP/release"
          f=$(find "$RUNNER_TEMP/release" -maxdepth 1 -name 'cyb3rb1ade-plur1bus-memory-*.tgz' | sort | head -n 1)
          [ -n "$f" ] || { echo "release $tag has no cyb3rb1ade-plur1bus-memory-*.tgz asset" >&2; exit 1; }
          rv=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { readPackageJsonFromTgz } from "./scripts/dist/build-plugin-feed.mjs"; process.stdout.write(readPackageJsonFromTgz(readFileSync(process.argv[1])).version)' "$f")
          { echo "RELEASE_TGZ=$f"; echo "RELEASE_VERSION=$rv"; } >> "$GITHUB_ENV"
          printf '### upgrade-from-release: %s (%s) → pack %s\n\n' "$tag" "$rv" "${{ needs.pack.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve OpenClaw latest (HM1-R12)
        id: oc
        run: printf 'version=%s\n' "$(npm view openclaw dist-tags.latest)" >> "$GITHUB_OUTPUT"
      - name: Install OpenClaw (POSIX, install-cli.sh)
        env:
          OC_VERSION: ${{ steps.oc.outputs.version }}
        run: |
          set -euo pipefail
          export HOME="$OPENCLAW_HOME"
          curl -fsSL --proto '=https' --tlsv1.2 https://openclaw.ai/install-cli.sh | bash -s -- --prefix "$RUNNER_TEMP/oc" --version "$OC_VERSION" --json
          echo "$RUNNER_TEMP/oc/bin" >> "$GITHUB_PATH"
      - name: assert-disposable (first step after installing OpenClaw, HM1-R11)
        # POSIX: every OpenClaw call runs with HOME = OPENCLAW_HOME (install-cli.sh step, ci-plugin-dist.mjs)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node tests/helpers/assert-disposable.mjs
          else
            HOME="$OPENCLAW_HOME" node tests/helpers/assert-disposable.mjs --var HOME
          fi
      - name: Restore the E5 model cache (HM1-R21)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/oc-home/models/plur1bus
          key: e5-614241f6-${{ runner.os }}-${{ runner.arch }}
      - name: Sign a TEST ONLY feed over the release and the pack
        run: node tests/helpers/sign-feed-for-ci.mjs --artefacts "$RUNNER_TEMP/plugin-dist" --tgz "$RELEASE_TGZ" --out-dir "$OC_FEED_DIR"
      # The release predates `plur1bus selftest`, so it is installed raw and the forced-failure rollback (whose verify
      # runs the old version's selftest) is skipped; the upgrade itself goes through install-plugin.sh --update.
      - name: Upgrade the release to the pack through the installer (store digest equal)
        run: node tests/helpers/ci-plugin-dist.mjs installer --artefacts "$RUNNER_TEMP/plugin-dist" --feed-dir "$OC_FEED_DIR" --bootstrap sh --from raw --from-tgz "$RELEASE_TGZ" --skip-forced-failure
      - name: ClawHub install record vs the GitHub Release tarball (fact k, informational)
        continue-on-error: true
        run: node tests/helpers/ci-plugin-dist.mjs clawhub --version "$RELEASE_VERSION" --compare-tgz "$RELEASE_TGZ"

  # HM2 Task 11 (D87, HM2-R16/R17/R19): the pack's installer and bootstraps install the plur1bus provider and its
  # pinned sidecar into a disposable Hermes on three OSes, min (743ee72 = 0.21.4) and latest (tested, f97608f =
  # 0.21.5). Hermes comes from that commit's own installer (harness hermes-host.yml, fact sheet §1), under
  # $RUNNER_TEMP: HERMES_HOME, PLUR1BUS_HOME, and HOME/XDG on POSIX. setup runs with --no-service
  # (PLUR1BUS_PLUGIN_TEST_NO_SERVICE=1) and the flat-embedder seam (no model download, F21). The sidecar and provider
  # artefacts are the harness release P4 named by scripts/dist/hermes-sidecar.lock.json: until it is released (and
  # vars.HM2_SIDECAR_RELEASED is 'true') the lock is a placeholder and these legs cannot pass, hence continue-on-error.
  hermes:
    name: hermes (${{ matrix.runner }}, Hermes ${{ matrix.hermes }})
    needs: pack
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ vars.HM2_SIDECAR_RELEASED != 'true' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
        hermes: [min, latest]
        include:
          - hermes: min
            hermes-commit: 743ee72596e7a9f23bc7cd5c570a6ebd958043e4
          - hermes: latest
            hermes-commit: f97608f178d1ffeca59860195ab7da295f7c8e5f
            previous-provider: builtin
    env:
      PLUR1BUS_PLUGIN_INSTALLER_TEST: '1'
      PLUR1BUS_PLUGIN_TEST_NO_SERVICE: '1'
      PLUR1BUS_ALLOW_TEST_INTERNALS: '1'
      PLUR1BUS_TEST_INTERNALS: flat-embedder
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Download the pack artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.pack.outputs.artifact }}
          path: ${{ runner.temp }}/plugin-dist
      - name: Disposable Hermes locations
        run: |
          {
            echo "HERMES_HOME=$RUNNER_TEMP/hh"
            echo "PLUR1BUS_HOME=$RUNNER_TEMP/p1b"
            echo "HERMES_DIR=$RUNNER_TEMP/hermes-agent"
            echo "FAKE_HOME=$RUNNER_TEMP/fakehome"
            echo "HERMES_FEED_DIR=$RUNNER_TEMP/hermes-feed"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hh" "$RUNNER_TEMP/fakehome"
          # POSIX: every step that runs Hermes or the installer sources this (HOME and XDG_* disposable, as the harness
          # hermes-host.yml); GitHub's Ubuntu images export XDG_CONFIG_HOME into the real profile otherwise.
          f="$RUNNER_TEMP/fakehome"
          printf 'export HOME="%s" XDG_CONFIG_HOME="%s/.config" XDG_DATA_HOME="%s/.local/share" XDG_STATE_HOME="%s/.local/state" XDG_CACHE_HOME="%s/.cache"\n' "$f" "$f" "$f" "$f" "$f" > "$RUNNER_TEMP/fake-env.sh"
      # The Windows leg changes the user PATH (Hermes' install.ps1) and puts the sidecar under %LOCALAPPDATA%: only on
      # an ephemeral GitHub-hosted runner.
      - name: The Windows leg runs on GitHub-hosted runners only
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        run: |
          echo "::error::the Hermes leg on Windows changes the user PATH and %LOCALAPPDATA%; it runs only on an ephemeral GitHub-hosted runner"
          exit 1
      # That commit's own installer, from a shallow fetch of exactly that commit (no raw.githubusercontent download).
      - name: Fetch the Hermes ${{ matrix.hermes }} installer
        env:
          COMMIT: ${{ matrix.hermes-commit }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hermes-src"
          git init -q "$src"
          for i in 1 2 3 4 5; do
            git -C "$src" fetch -q --depth 1 https://github.com/NousResearch/hermes-agent "$COMMIT" && break
            [ "$i" = 5 ] && { echo "::error::could not fetch hermes-agent $COMMIT"; exit 1; }
            sleep 10
          done
          git -C "$src" show "$COMMIT:scripts/install.sh" > "$RUNNER_TEMP/hermes-install.sh"
          git -C "$src" show "$COMMIT:scripts/install.ps1" > "$RUNNER_TEMP/hermes-install.ps1"
      - name: Install Hermes ${{ matrix.hermes }} (POSIX)
        if: runner.os != 'Windows'
        timeout-minutes: 20
        env:
          COMMIT: ${{ matrix.hermes-commit }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/fake-env.sh"
          bash "$RUNNER_TEMP/hermes-install.sh" --branch main --commit "$COMMIT" --force-commit --dir "$HERMES_DIR" --hermes-home "$HERMES_HOME" \
            --skip-setup --non-interactive --skip-browser --skip-computer-use --no-skills < /dev/null
          echo "HERMES_BIN=$HERMES_DIR/venv/bin/hermes" >> "$GITHUB_ENV"
          echo "$HERMES_DIR/venv/bin" >> "$GITHUB_PATH"
      - name: Install Hermes ${{ matrix.hermes }} (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 30
        env:
          COMMIT: ${{ matrix.hermes-commit }}
          # Harness 4eea755: install.ps1 clones under Git for Windows' system core.autocrlf=true and then fails to check
          # out the pinned commit; a step-scoped global config with autocrlf off (never the real profile's) avoids it.
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/hermes-gitconfig
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -LiteralPath $env:GIT_CONFIG_GLOBAL -Encoding ascii -Value "[core]`n`tautocrlf = false"
          $script = Join-Path $env:RUNNER_TEMP 'hermes-install.ps1'
          & powershell -NoProfile -ExecutionPolicy Bypass -File $script -Commit $env:COMMIT -ForceCommit -HermesHome $env:HERMES_HOME -InstallDir $env:HERMES_DIR -NonInteractive -SkipSetup -SkipComputerUse
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          $cands = @("$env:HERMES_DIR\venv\Scripts\hermes.exe", "$env:HERMES_HOME\bin\hermes.exe", "$env:HERMES_HOME\bin\hermes.cmd")
          $bin = $cands | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $bin) { throw "no hermes launcher found in: $($cands -join '; ')" }
          "HERMES_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path -Parent $bin) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: assert-disposable (first step after installing Hermes, HM1-R11)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node tests/helpers/assert-disposable.mjs --host hermes
          else
            . "$RUNNER_TEMP/fake-env.sh"
            node tests/helpers/assert-disposable.mjs --host hermes --var HOME --var XDG_CONFIG_HOME --var XDG_DATA_HOME --var XDG_STATE_HOME --var XDG_CACHE_HOME
          fi
      - name: hermes --version
        run: |
          if [ "$RUNNER_OS" != Windows ]; then . "$RUNNER_TEMP/fake-env.sh"; fi
          "$HERMES_BIN" --version
      - name: Sign a TEST ONLY feed with hosts.hermes over the pack artefact
        run: node tests/helpers/sign-feed-for-ci.mjs --artefacts "$RUNNER_TEMP/plugin-dist" --out-dir "$HERMES_FEED_DIR"
      # install-plugin.sh on POSIX, install-plugin.ps1 -Host hermes under Windows PowerShell 5.1 on Windows.
      # latest: memory.provider starts at a non-empty value ("builtin", Hermes' built-in store), so the uninstall must
      # restore that value, not just "unset" (min starts unset: the 0.21.4 line-edit undo path)
      - name: Bootstrap --host hermes (install, memory status, selftest, up-to-date re-run, uninstall)
        env:
          PREVIOUS_PROVIDER: ${{ matrix.previous-provider }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node tests/helpers/ci-hermes-dist.mjs install --artefacts "$RUNNER_TEMP/plugin-dist" --feed-dir "$HERMES_FEED_DIR" --hermes-bin "$HERMES_BIN" --bootstrap ps1 ${PREVIOUS_PROVIDER:+--previous-provider "$PREVIOUS_PROVIDER"}
          else
            . "$RUNNER_TEMP/fake-env.sh"
            node tests/helpers/ci-hermes-dist.mjs install --artefacts "$RUNNER_TEMP/plugin-dist" --feed-dir "$HERMES_FEED_DIR" --hermes-bin "$HERMES_BIN" --bootstrap sh ${PREVIOUS_PROVIDER:+--previous-provider "$PREVIOUS_PROVIDER"}
          fi

  # C8: non-blocking. Hermes (min) inside WSL Ubuntu-24.04, the plugin installed from Windows through
  # install-plugin.ps1 -Host hermes -Target wsl:Ubuntu-24.04; the distro's own run verifies the feed again.
  hermes-wsl:
    name: hermes-wsl (windows-2025, Ubuntu-24.04, Hermes min)
    needs: pack
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 120
    env:
      PLUR1BUS_PLUGIN_INSTALLER_TEST: '1'
      PLUR1BUS_PLUGIN_TEST_NO_SERVICE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Download the pack artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.pack.outputs.artifact }}
          path: ${{ runner.temp }}/plugin-dist
      - name: The WSL leg runs on GitHub-hosted runners only
        if: runner.environment != 'github-hosted'
        run: |
          echo "::error::the Hermes WSL leg installs a distro and runs as root in it; it runs only on an ephemeral GitHub-hosted runner"
          exit 1
      # Vampire/setup-wsl v7.0.0 (tag object 5fae231e, commit d1da7f2c), as the OpenClaw wsl leg.
      - name: Set up WSL Ubuntu-24.04
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl ca-certificates git
      - name: Install Hermes min inside WSL (prefix and homes under /tmp/plur1bus-ci-hermes)
        run: node tests/helpers/ci-hermes-dist.mjs wsl-setup --distro Ubuntu-24.04 --hermes-commit 743ee72596e7a9f23bc7cd5c570a6ebd958043e4
      - name: Sign a TEST ONLY feed with hosts.hermes over the pack artefact
        run: node tests/helpers/sign-feed-for-ci.mjs --artefacts "$RUNNER_TEMP/plugin-dist" --out-dir "$RUNNER_TEMP/hermes-feed"
      - name: install-plugin.ps1 -Host hermes -Target wsl:Ubuntu-24.04 --non-interactive --json
        run: node tests/helpers/ci-hermes-dist.mjs wsl-install --distro Ubuntu-24.04 --artefacts "$RUNNER_TEMP/plugin-dist" --feed-dir "$RUNNER_TEMP/hermes-feed"
      - name: Selftest inside WSL
        run: node tests/helpers/ci-hermes-dist.mjs wsl-selftest --distro Ubuntu-24.04

  # HM2-R16 / F33: the pinned bootstrap Node is nodejs.org's own (SHASUMS256.txt of the pinned version) and the
  # sidecar lock's Node version.
  node-pins:
    name: node-pins (nodejs.org SHASUMS256.txt)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Compare scripts/dist/node-pins.json with nodejs.org
        run: |
          set -euo pipefail
          v=$(node -p "require('./scripts/dist/node-pins.json').version")
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 "https://nodejs.org/dist/v$v/SHASUMS256.txt" -o "$RUNNER_TEMP/SHASUMS256.txt"
          node tests/helpers/check-node-pins.mjs --pins scripts/dist/node-pins.json --shasums "$RUNNER_TEMP/SHASUMS256.txt" --lock scripts/dist/hermes-sidecar.lock.json
