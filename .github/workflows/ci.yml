name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.16.0', 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
        env:
          # tests/dist-hermes-lock-interop.test.js: Node and Python (>= 3.11, on the image) on one registry lock
          PLUR1BUS_REQUIRE_LOCK_INTEROP: '1'
      # Informational policy retained. The pinned optional inference patches
      # (adm-zip 0.6.1, sharp 0.35.4) are covered by local-inference regressions;
      # audit output remains visible for newly published advisories.
      - name: Run security audit (informational)
        run: npm audit --audit-level=moderate || true
      - name: Verify lockfile signatures (informational)
        run: npm audit signatures || true

  # Full suite on the OSes the plugin ships to (HM1 Task 9, spec A.2 step 4).
  # Platform-specific skips live in the tests, each with a reason string
  # (tests/platform-skips.test.js). Optional ONNX/sharp packages must install,
  # so npm ci runs with lifecycle scripts.
  test-cross:
    name: test-cross (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # Windows: 60. The suite ran 2649 s on windows-2025 on 2026-09-29, 2029 s of it one hung test file
    # (obsidian-bridge-memory-mirror kept a watch timer after failed assertions; fixed in the test file). Without the
    # hang ~620 s covered 326 of 586 files,
    # including ~215 s of powershell.exe start-ups in the .ps1 bootstrap tests; windows-11-arm is slower still.
    # 60 keeps a margin; macOS stays at 45.
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 60 || 45 }}
    # The windows-2025 legs are required since Windows round 4 (HM1-R22: informational until green; tc6 at 9be9b463
    # failed only timing/port flakes, fixed in the tests). macOS stays blocking.
    # windows-11-arm stays informational: Windows PowerShell 5.1 on the hosted arm64 image takes 15-45 s per cold run
    # (tc6: the two b13 win32 ACL tests ran 88.8 s and 44.8 s there against 1.2-1.8 s on windows-2025), which is at the
    # product's documented 30 s cap on one PowerShell ACL read (lib/platform.js readDirectoryAcl, docs/engine-api.md
    # "Cost on Windows"). The first verified-path share then fails closed by design (tc6: "/share runs through
    # engine.memory.share ..." answered "Sharing failed" after 30.3 s, same in tc2). Making the leg required needs an
    # owner ruling on that cap (or a faster ACL read), not a test change; see ci/windows-failures-2.md, Round 4.
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, node-version: '24.16.0' }
          - { os: windows-2025, node-version: '24.21.0' }
          - { os: windows-11-arm, node-version: '24.21.0' }
          - { os: macos-15, node-version: '24.21.0' }
    steps:
      # Audit artefacts under docs/ exceed MAX_PATH; must be set before checkout.
      - name: Enable git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # test:cross = the suite with --test-timeout=600000: a hung test fails after 10 min instead of running into the
      # job timeout, which cancels every later file. Not --test-force-exit: it ends a file before tests that register
      # late run (85 of 5962 tests silently missing on Linux). The Linux `test` job keeps plain `npm test`.
      - name: Run tests
        run: npm run test:cross
        env:
          # tests/dist-hermes-lock-interop.test.js on macOS and Windows (harness cab7783's Windows lock retries)
          PLUR1BUS_REQUIRE_LOCK_INTEROP: '1'

  # engine-win review item 8: the .ps1 bootstrap's wsl:<distro> path pipes the verified bootstrap.sh into
  # `wsl.exe ... sh -s`. Under Windows PowerShell 5.1 (.NET Framework) a UTF-8 console input encoding used to put
  # a BOM (EF BB BF) in front of it. This blocking byte check runs that path under powershell.exe (and pwsh) against
  # the wsl.exe shim and asserts the child's stdin is the feed's sh byte for byte, with no BOM.
  # The test runs the .ps1 three times per shell; each powershell.exe run may take up to 360 s (psRunTimeoutMs in the
  # test: a cold first run on a fresh VM passed the old 120 s limit, tc4), so 15 minutes no longer bound the job.
  bootstrap-stdin-bytes:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Windows PowerShell 5.1 is present
        shell: pwsh
        run: |
          $v = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -Command '$PSVersionTable.PSVersion.Major'
          if ("$v".Trim() -ne '5') { throw "expected Windows PowerShell 5.x, got '$v'" }
      # --test-name-pattern reports filtered-out tests as skipped and exits 0, so a renamed test would leave this
      # green without any byte check: the TAP output must show the byte check passing (not skipped) at least once.
      - name: Piped sh reaches wsl.exe without a BOM
        shell: pwsh
        env:
          PLUR1BUS_REQUIRE_PS51: '1'
        run: |
          $out = node --test --test-reporter=tap '--test-name-pattern=wsl:<d> pipes the verified sh' tests/dist-bootstrap-ps1.test.js 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { exit $code }
          $ran = @([regex]::Matches($out, '(?m)^\s*ok \d+ - wsl:<d> pipes the verified sh(?![^\r\n]*# SKIP)')).Count
          $pass = [regex]::Match($out, '(?m)^# pass (\d+)').Groups[1].Value
          if ($ran -lt 1 -or [int]$pass -lt 1) { throw "the byte check did not run (matching ok lines: $ran, # pass: $pass)" }

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5b8a807627bf8 # v4.6.0
