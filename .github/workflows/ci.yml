name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: ['24.16.0', 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      # Shipped graph must stay clean. Dev/test findings (OpenClaw host and its
      # transitive tree) are recorded as advisory so a new high does not block
      # the suite; omit=dev is the gate that protects the published package.
      - name: Audit shipped graph (blocking)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit full graph (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Verify lockfile signatures (informational)
        run: npm audit signatures || true

  # Full suite on the OSes the plugin ships to (HM1 Task 9, spec A.2 step 4).
  # Platform-specific skips live in the tests, each with a reason string
  # (tests/platform-skips.test.js). Optional ONNX/sharp packages must install,
  # so npm ci runs with lifecycle scripts.
  test-cross:
    name: test-cross (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # Windows: 60. The suite ran 2649 s on windows-2025 on 2026-09-29, 2029 s of it one hung test file
    # (obsidian-bridge-memory-mirror kept a watch timer after failed assertions; fixed in the test file);
    # windows-11-arm is slower still. 60 keeps a margin; macOS stays at 45.
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 60 || 45 }}
    # windows-2025 is required since Windows round 4 (HM1-R22). macOS stays blocking.
    # windows-11-arm is required: readDirectoryAcl uses System32 cscript WMI + whoami
    # (~0.4 s cold on this image, probe 37123429626) and falls back to PowerShell 5.1
    # (15-45 s). The 30 s product cap is unchanged. Three consecutive green legs on
    # d90c278 (jobs 111220726960, 111224461284, 111228506814).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, node-version: '24.16.0' }
          - { os: windows-2025, node-version: '24.21.0' }
          - { os: windows-11-arm, node-version: '24.21.0' }
          - { os: macos-15, node-version: '24.21.0' }
    steps:
      # Audit artefacts under docs/ exceed MAX_PATH; must be set before checkout.
      - name: Enable git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # test:cross = the suite with --test-timeout=600000: a hung test fails after 10 min instead of running into the
      # job timeout, which cancels every later file. Not --test-force-exit: it ends a file before tests that register
      # late run (85 of 5962 tests silently missing on Linux). The Linux `test` job keeps plain `npm test`.
      - name: Run tests
        run: npm run test:cross

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5b8a807627bf8 # v4.6.0
