name: Hermes 7.19.2 GitHub Packages publication

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after both fixed source-bound CI gates pass.
        type: boolean
        default: false
      tarball_sha256:
        description: Digest of the reviewed preflight artifact (required for publication).
        type: string
        default: ''
      preflight_run:
        description: Run containing the reviewed immutable preflight artifact.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hermes-registry-7.19.2
  cancel-in-progress: false

env:
  SOURCE: 75fa327ec00156f5b4db370c442730f7091811b7
  VERSION: 7.19.2-hermes.1
  PACKAGE: '@cyb3rb1ade/plur1bus-memory'
  TARBALL: cyb3rb1ade-plur1bus-memory-7.19.2-hermes.1.tgz
  REGISTRY: https://npm.pkg.github.com

jobs:
  package:
    if: '!inputs.publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 75fa327ec00156f5b4db370c442730f7091811b7
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          registry-url: https://npm.pkg.github.com
          scope: '@cyb3rb1ade'
      - name: Build and validate exact npm tarball
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain)"
          out="$RUNNER_TEMP/hermes-registry"
          mkdir "$out"
          npm pack --ignore-scripts --json --pack-destination "$out" > "$out/npm-pack.json"
          jq -e --arg p "$PACKAGE" --arg v "$VERSION" --arg f "$TARBALL" '
            length == 1 and .[0].name == $p and .[0].version == $v and .[0].filename == $f
            and (.[0].files | map(.path) |
                 index("plur1bus-hermes/pyproject.toml") != null
                 and index("hermes-dashboard/plur1bus/desktop/plugin.js") != null
                 and index("dist/control-ui/jev-key/index.js") != null
                 and all(test("(^|/)([.]git|[.]env|[.]github|__pycache__|node_modules)(/|$)") | not))
          ' "$out/npm-pack.json"
          cd "$out"
          sha256sum "$TARBALL" > SHA256SUMS
          cat SHA256SUMS
      - name: Verify repository-scoped registry read access
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm view "$PACKAGE" dist-tags --json --registry "$REGISTRY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-registry-tarball
          path: ${{ runner.temp }}/hermes-registry/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Require the exact passing platform and native Hermes PM runs
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN: ${{ inputs.preflight_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42522867546" |
            jq -e --arg sha "$SOURCE" '.head_sha == $sha and .conclusion == "success"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42522867550" |
            jq -e --arg sha "$SOURCE" '.head_sha == $sha and .conclusion == "success"'
          [[ "$PREFLIGHT_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN" |
            jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha and .conclusion == "success"'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          registry-url: https://npm.pkg.github.com
          scope: '@cyb3rb1ade'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hermes-registry-tarball
          path: ${{ runner.temp }}/hermes-registry
          run-id: ${{ inputs.preflight_run }}
          github-token: ${{ github.token }}
      - name: Publish only hermes and verify the downloaded bytes and untouched latest tag
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          EXPECTED_DIGEST: ${{ inputs.tarball_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hermes-registry"
          sha256sum --check SHA256SUMS
          [[ "$EXPECTED_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test "$(cut -d' ' -f1 SHA256SUMS)" = "$EXPECTED_DIGEST"
          before=$(npm view "$PACKAGE" dist-tags --json --registry "$REGISTRY" --prefer-online)
          test "$(jq -r '.hermes' <<< "$before")" = '7.19.2-hermes.0'
          npm publish "./$TARBALL" --ignore-scripts --tag hermes --registry "$REGISTRY"
          after=$(npm view "$PACKAGE" dist-tags --json --registry "$REGISTRY" --prefer-online)
          test "$(jq -r '.latest // ""' <<< "$before")" = "$(jq -r '.latest // ""' <<< "$after")"
          test "$(jq -r '.hermes' <<< "$after")" = "$VERSION"
          mkdir "$RUNNER_TEMP/registry-download"
          npm pack "$PACKAGE@$VERSION" --ignore-scripts --registry "$REGISTRY" --prefer-online \
            --cache "$RUNNER_TEMP/registry-verify-cache" --pack-destination "$RUNNER_TEMP/registry-download"
          cmp "$TARBALL" "$RUNNER_TEMP/registry-download/$TARBALL"
          jq -n --arg version "$VERSION" --arg sha "$EXPECTED_DIGEST" --arg source "$SOURCE" \
            --argjson before "$before" --argjson after "$after" \
            '{version:$version,sha256:$sha,source:$source,bitIdentical:true,distTagsBefore:$before,distTagsAfter:$after}' \
            > "$RUNNER_TEMP/registry-download/registry-verification.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-registry-verification
          path: ${{ runner.temp }}/registry-download/registry-verification.json
          if-no-files-found: error
