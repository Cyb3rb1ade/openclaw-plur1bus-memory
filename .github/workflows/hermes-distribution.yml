name: Hermes portable and native distribution

on:
  workflow_dispatch:
  push:
    branches: ['codex/hermes-distribution-*']
    paths:
      - 'distribution/**'
      - 'plur1bus-hermes/**'
      - 'plur1bus-controls/**'
      - 'hermes-dashboard/**'
      - 'scripts/hermes-desktop-host.py'
      - '.github/workflows/hermes-distribution.yml'
  pull_request:
    paths:
      - 'distribution/**'
      - 'plur1bus-hermes/**'
      - 'plur1bus-controls/**'
      - 'hermes-dashboard/**'
      - '.github/workflows/hermes-distribution.yml'

permissions:
  contents: read
  actions: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04-arm
            python: '3.12'
          - os: macos-15
            python: '3.12'
          - os: windows-2025
            python: '3.12'
          - os: windows-11-arm
            python: '3.13'
            native: windows-arm64
          # Current Hermes PM uses Python 3.14. Keep legacy package gates too;
          # these runs prove runtime compatibility, not official PM admission.
          - os: ubuntu-24.04
            python: '3.14'
            artifact-suffix: '-py314'
          - os: ubuntu-24.04-arm
            python: '3.14'
            artifact-suffix: '-py314'
          - os: macos-15
            python: '3.14'
            artifact-suffix: '-py314'
          - os: windows-2025
            python: '3.14'
            artifact-suffix: '-py314'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Enable Windows checkout of retained long audit paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Inventory and parity tests inspect retained upstream tags and commits.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Recover hash-pinned Windows ARM wheels from published 7.18.4
        if: matrix.native == 'windows-arm64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 7.18.4-hermes.0 --repo Cyb3rb1ade/openclaw-plur1bus-memory --pattern 'plur1bus-7.18.4-hermes.0-windows-arm64.zip' --pattern 'source-pinned-provenance.json' --dir "$env:RUNNER_TEMP/plur1bus-arm-inputs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/scripts/recover-hermes-arm-wheels.py "$env:RUNNER_TEMP/plur1bus-arm-inputs" "$env:RUNNER_TEMP/plur1bus-native-candidates"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bind Windows ARM candidate paths and source provenance
        if: matrix.native == 'windows-arm64'
        shell: pwsh
        run: |
          "PLUR1BUS_ARM_LANCEDB_WHEEL=$env:RUNNER_TEMP/plur1bus-native-candidates/classic-lancedb/lancedb-0.34.0-cp39-abi3-win_arm64.whl" >> $env:GITHUB_ENV
          "PLUR1BUS_ARM_LANCEDB_SOURCE=$env:RUNNER_TEMP/plur1bus-native-candidates/classic-lancedb/UPSTREAM_COMMIT.txt" >> $env:GITHUB_ENV
          "PLUR1BUS_ARM_PYARROW_WHEEL=$env:RUNNER_TEMP/plur1bus-native-candidates/classic-pyarrow/pyarrow-25.0.1-cp313-cp313-win_arm64.whl" >> $env:GITHUB_ENV
          "PLUR1BUS_ARM_PYARROW_SOURCE=$env:RUNNER_TEMP/plur1bus-native-candidates/classic-pyarrow/UPSTREAM_COMMIT.txt" >> $env:GITHUB_ENV
      - name: Verify reviewed native artifacts before any dependency install
        if: matrix.native == 'windows-arm64'
        run: python distribution/ci.py --provision-native
      - name: Build and test tools
        run: python -m pip install 'setuptools>=75' wheel pytest pytest-subtests PyYAML 'pyinstaller==6.22.2'
      - name: CPU PyTorch (avoid unrelated CUDA downloads)
        if: runner.os == 'Linux' || matrix.os == 'windows-2025'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install candidate runtime dependencies
        run: python -m pip install './plur1bus-hermes[local-onnx]' ./plur1bus-controls
      - name: Validate resolved dependency environment
        run: python -m pip check
      - name: Tests, native packaging and isolated actual installation
        run: python distribution/ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plur1bus-hermes-${{ matrix.os }}${{ matrix.artifact-suffix }}
          path: distribution-artifacts/*
          if-no-files-found: error
          retention-days: 14
