name: Windows verified-path shared memory

# ADR 0001 (E4 Task 10): the first real run of the verified-path directory
# code on Windows — icacls, the PowerShell ACL read, reparse-point refusal and
# lstat-pinned identities. POSIX-mode cases skip on win32.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verified-path:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Audit artefacts under docs/ exceed MAX_PATH; without this the checkout fails.
      - run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verified-path directories and shared memory
        run: >-
          node --test
          tests/verified-path-directory.test.js
          tests/b13-shared-memory-verified-path.test.js
