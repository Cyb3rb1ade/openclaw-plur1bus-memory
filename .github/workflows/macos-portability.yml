name: macOS path and capability contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portability:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonical paths and fail-closed shared capabilities
        run: >-
          node --test
          tests/b13-memory-request-context.test.js
          tests/reembedding-generation-layout.test.js
          tests/openclaw-default-llm-runtime.test.js
          tests/release-731-runtime-callsite-security.test.js
          tests/b13-shared-memory-pool.test.js
