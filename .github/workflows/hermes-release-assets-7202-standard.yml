name: Upload verified Hermes 7.20.2 assets (standard)
'on':
  push:
    branches:
    - codex/hermes-release-assets-7202-standard
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Stage checked bytes on the release draft
      shell: bash
      run: "set -euo pipefail\nrepo=Cyb3rb1ade/openclaw-plur1bus-memory\ntest \"$GITHUB_REPOSITORY\"\
        \ = \"$repo\"\ntag=7.20.2-hermes.0\ndraft=451584192\nsource=f8f24c445cc39c577fa7b8e93131616ea51b3310\n\
        object=$(gh api \"repos/$repo/git/ref/tags/$tag\" --jq .object.sha)\ntest\
        \ \"$(gh api \"repos/$repo/git/tags/$object\" --jq .object.sha)\" = \"$source\"\
        \ngh api \"repos/$repo/releases/$draft\" | jq -e --arg tag \"$tag\" '.draft\
        \ and .prerelease and .tag_name == $tag'\ncd \"$RUNNER_TEMP\"\nupload() {\n\
        \        path=$1\n        name=$2\n        digest=$3\n        test \"$(sha256sum\
        \ \"$path\" | cut -d' ' -f1)\" = \"$digest\"\n        result=$(gh api \"repos/$repo/releases/$draft\"\
        \ | jq -c --arg name \"$name\" '.assets[] | select(.name == $name)')\n   \
        \     if [[ -n \"$result\" ]]; then\n            jq -e --arg digest \"sha256:$digest\"\
        \ '.state == \"uploaded\" and .digest == $digest' <<< \"$result\"\n      \
        \      return\n        fi\n        if [[ \"$path\" != \"$name\" ]]; then cp\
        \ \"$path\" \"$name\"; fi\n        gh release upload \"$tag\" --repo \"$repo\"\
        \ \"$name\"\n        gh api \"repos/$repo/releases/$draft\" | jq -e --arg\
        \ name \"$name\" --arg digest \"sha256:$digest\" '.assets[] | select(.name\
        \ == $name) | .state == \"uploaded\" and .digest == $digest'\n    }\ngh run\
        \ download 44562128302 --repo \"$repo\" --name plur1bus-hermes-ubuntu-24.04\
        \ --dir package-0\nupload package-0/plur1bus-7.20.2-hermes.0.tar.gz plur1bus-7.20.2-hermes.0-linux-x64.tar.gz\
        \ 53080dc7913d3254ce4f56d61cc83d3b3913008c70748af315061dfe221bed1d\nupload\
        \ package-0/plur1bus-7.20.2-hermes.0.zip plur1bus-7.20.2-hermes.0-linux-x64.zip\
        \ 257c6f3897abe84f6b0d205966ecc3544b6a603bc42f09d181e5ecadc51f9ec7\ngh run\
        \ download 44562128302 --repo \"$repo\" --name plur1bus-hermes-ubuntu-24.04-arm\
        \ --dir package-1\nupload package-1/plur1bus-7.20.2-hermes.0.tar.gz plur1bus-7.20.2-hermes.0-linux-arm64.tar.gz\
        \ d30e3e23bed029fb3d621b2c1e77d266e07a8529cffb2dd8a7a82612435991e1\nupload\
        \ package-1/plur1bus-7.20.2-hermes.0.zip plur1bus-7.20.2-hermes.0-linux-arm64.zip\
        \ a5741f42ce1ccdce2d4d5faf289d8e86e0b426047ed2d35ed52c6b029a1e03d5\ngh run\
        \ download 44562128302 --repo \"$repo\" --name plur1bus-hermes-windows-2025\
        \ --dir package-2\nupload package-2/plur1bus-7.20.2-hermes.0-windows-x64.tar.gz\
        \ plur1bus-7.20.2-hermes.0-windows-x64.tar.gz 53993fce48b78ebfb52df5363d0f55a252c3e12cb687d1bb161768186dbe86bd\n\
        upload package-2/plur1bus-7.20.2-hermes.0-windows-x64.zip plur1bus-7.20.2-hermes.0-windows-x64.zip\
        \ da10aca6953edc447ee6c88938a518adb4d640e920c2ebdb639dbd571050f74b\nupload\
        \ package-2/plur1bus-7.20.2-hermes.0-windows-x64-setup-unsigned.exe plur1bus-7.20.2-hermes.0-windows-x64-setup-unsigned.exe\
        \ 10b86205ec7566164cef9ce12944a358c9890a655a3e206ea0aad9b184ff0650\ngh run\
        \ download 44562435002 --repo \"$repo\" --name hermes-npm-candidate --dir\
        \ package-3\nupload package-3/cyb3rb1ade-plur1bus-memory-7.20.2-hermes.0.tgz\
        \ cyb3rb1ade-plur1bus-memory-7.20.2-hermes.0.tgz 082a9928bca0ea8ba93ae926a4831e3c86bb1b80cb0ae0bc45be873e2166521e\n"
