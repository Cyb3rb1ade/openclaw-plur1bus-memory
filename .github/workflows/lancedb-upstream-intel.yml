name: Verify LanceDB Intel upstream contribution

on:
  workflow_dispatch:
  push:
    branches: ['codex/hermes-distribution-*']
    paths: ['.github/workflows/lancedb-upstream-intel.yml']

permissions:
  contents: read

jobs:
  upstream-wheel:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Cyb3rb1ade/lancedb
          # Reviewed draft PR lancedb/lancedb#4140, not a moving PR ref.
          ref: fa824b927d2fa40072cba1472e625ce9df746434
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Require native Intel runner
        run: test "$(uname -m)" = x86_64
      - uses: ./.github/workflows/build_mac_wheel
        with:
          python-minor-version: 12
          args: --locked --release --strip --target x86_64-apple-darwin --features fp16kernels
      - name: Exercise the installed upstream wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install "$GITHUB_WORKSPACE"/target/wheels/lancedb-*.whl
          wheel-env/bin/python -m pip check
          wheel-env/bin/python "$GITHUB_WORKSPACE/ci/smoke_native_wheel.py" --architecture x86_64
      - name: Record provenance
        run: |
          git rev-parse HEAD > target/wheels/UPSTREAM_COMMIT.txt
          cp Cargo.lock target/wheels/Cargo.lock
          rustc --version > target/wheels/RUST_VERSION.txt
          shasum -a 256 target/wheels/*.whl > target/wheels/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lancedb-upstream-pr-4140-intel
          path: target/wheels/*
          if-no-files-found: error
          retention-days: 14
