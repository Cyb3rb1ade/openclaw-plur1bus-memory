[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plur1bus-hermes"
version = "7.12.0.post2"
description = "Hermes Python runtime implementation of the PLUR1BUS memory provider and migration tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lancedb==0.34.0",
  "numpy==2.2.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "numpy==2.3.0; sys_platform == 'win32' and platform_machine == 'ARM64'",
  "PyYAML>=6,<7",
  # These native targets use explicit ONNX providers, not an implicit old torch
  # downgrade or x64 emulation. Existing transformer installations are retained.
  "sentence-transformers>=3.0,<4; (sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]

[project.optional-dependencies]
local-onnx = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "certifi>=2024.8.30"]
local-transformers = ["sentence-transformers>=3.0,<4"]

[project.scripts]
plur1bus-hermes = "plur1bus_hermes.cli:main"
plur1bus-hermes-operator = "plur1bus_hermes.operator_cli:main"
plur1bus-hermes-migrate = "plur1bus_hermes.migrate:main"
plur1bus-hermes-reembed = "plur1bus_hermes.reembed:main"
plur1bus-hermes-workspace-migrate = "plur1bus_hermes.workspace_migrate:main"
plur1bus-hermes-cutover = "plur1bus_hermes.cutover:main"
plur1bus-hermes-jobs = "plur1bus_hermes.jobs:main"
plur1bus-hermes-jobs-install = "plur1bus_hermes.job_install:main"
plur1bus-hermes-parity = "plur1bus_hermes.parity:main"
plur1bus-hermes-snapshot = "plur1bus_hermes.snapshot:main"
plur1bus-hermes-repair-tombstones = "plur1bus_hermes.tombstone:repair_cli_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plur1bus_hermes = ["plugin.yaml"]
